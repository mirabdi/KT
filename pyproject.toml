[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ktbench"
version = "0.1.0"
description = "Extensible, OOP-driven Knowledge Tracing benchmarking framework (AKT, DKT, SAKT, ...) for PyTorch 2.x with Apple Silicon (MPS) support."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
ktbench = "ktbench.cli:main"

[tool.setuptools.packages.find]
include = ["ktbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: end-to-end training runs (deselect with -m 'not slow')",
]
