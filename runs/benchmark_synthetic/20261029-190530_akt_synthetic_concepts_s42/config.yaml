name: benchmark_synthetic
seed: 42
device: auto
output_dir: runs
data:
  adapter: synthetic
  adapter_params:
    n_students: 500
    n_concepts: 30
    n_questions: 300
    max_len: 200
    seed: 2
    use_questions: false
    name: synthetic_concepts
  split:
  - 0.7
  - 0.1
  - 0.2
  max_seq_len: 200
  window_stride: null
  min_seq_len: 2
  num_workers: 0
  length_bucketing: true
model:
  name: akt
  params:
    d_model: 128
    d_ff: 512
    n_heads: 8
    dropout: 0.1
train:
  epochs: 8
  batch_size: 32
  optimizer: adam
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 0.0
  patience: 5
  monitor: auc
  log_every: 0
  compile: false
  save_checkpoints: true
memory:
  memory_cap_gb: 11.0
  enforce_cap: true
  safety_factor: 0.75
  auto_budget: true
  cost_budget: null
  max_micro_batch: 256
  oom_retry: true
  max_oom_retries: 6
  empty_cache_each_epoch: true
  amp: false
  amp_dtype: bfloat16
